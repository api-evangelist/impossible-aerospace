name: Impossible Aerospace
description: 'Impossible Aerospace is a deep-tech aerospace hardware company founded in 2016 by Spencer
  Gore in Santa Clara, California. It builds the US-1, a long-range all-electric quadcopter whose lithium-ion
  cells form part of the airframe structure, giving it up to roughly two hours of flight time for aerial
  imaging, surveillance, and public-safety missions with law enforcement and first responders. The US-1
  runs the third-party Auterion OS flight stack (built on the PX4 open autopilot). The company was later
  acquired and operates as a small team. Enrichment note (2026-07-19): the company publishes no public
  API, SDK, or developer surface, and its primary domain impossible.aero no longer resolves in DNS.'
